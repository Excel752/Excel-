<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>稼働ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0d10;--card:#17171b;--line:#2e2e35;--text:#f0f0f2;--muted:#8f8f99;--gold:#d6bb79;--plus:#7ed6a0;--minus:#f08d91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:20px;margin:0}.back{font-size:12px;color:var(--muted);text-decoration:none}.tabs,.scopeTabs{display:flex;gap:6px;margin-bottom:10px}.tab,.scopeTab{flex:1;border:1px solid var(--line);background:#151519;color:var(--muted);padding:9px;border-radius:9px;font-weight:800}.tab.on,.scopeTab.on{background:#ece8df;color:#111}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.lab{font-size:10px;color:var(--muted)}.val{font-size:20px;font-weight:900;margin-top:4px}.panel{margin-top:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px}.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #29292f;padding:10px 1px;font-size:11px}.row:first-child{border-top:0}.machine{font-weight:900}.sub{color:var(--muted);font-size:9px}.right{text-align:right}.emptymsg{text-align:center;color:var(--muted);font-size:11px;padding:17px 0}.note{text-align:center;color:#666670;font-size:9px;margin-top:13px}.login{max-width:420px;margin:14vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.login h2{margin:0 0 12px;font-size:18px}.field{width:100%;margin:6px 0;background:#111115;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px}.primary{width:100%;margin-top:8px;border:0;border-radius:9px;padding:12px;background:#ece8df;color:#111;font-weight:900}.ghost{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#202025;color:#bbb;font-weight:700}.status{font-size:10px;color:var(--muted);margin-top:8px}.error{color:#f08d91}.ok{color:#7ed6a0}.hidden{display:none!important}.membergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.membercard{background:#111115;border:1px solid #28282e;border-radius:10px;padding:10px}.membername{font-size:12px;font-weight:900}.memberavg{font-size:19px;font-weight:900;margin-top:4px}.badge{display:inline-block;border:1px solid #44414a;border-radius:999px;padding:3px 7px;font-size:8px;color:var(--muted);margin-left:5px}.sectiontitle{font-size:13px;font-weight:900;margin-bottom:7px}.periodnote{text-align:center;font-size:9px;color:var(--muted);margin:8px 0 0}.periodnote b{color:var(--gold)}.metrics{font-size:10px;line-height:1.65;margin-top:5px}.danger{color:#f08d91}.muted{color:var(--muted)}.topActions{display:flex;gap:8px;align-items:center}.deleteBtn{margin-top:6px;border:1px solid #5a3035;background:#2a171a;color:#f3a3a8;border-radius:7px;padding:5px 9px;font-size:9px;font-weight:800}.deleteBtn:disabled{opacity:.5}.homeBtn{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#202025;color:#ddd;font-weight:700;text-decoration:none;font-size:12px}
@media(max-width:380px){.val{font-size:18px}.memberavg{font-size:17px}}
</style></head><body>
<div id="loginView" class="login">
  <h2>📊 稼働ダッシュボード</h2>
  <div class="lab">管理者アカウントでログイン（初回のみ）</div>
  <input id="email" class="field" type="email" autocomplete="username" placeholder="メールアドレス">
  <input id="password" class="field" type="password" autocomplete="current-password" placeholder="パスワード">
  <button id="loginBtn" class="primary">ログイン</button>
  <div id="loginStatus" class="status"></div>
</div>
<div id="appView" class="wrap hidden">
  <div class="top"><div><h1>📊 稼働ダッシュボード</h1><div id="who" class="status"></div></div><div class="topActions"><a class="homeBtn" href="./index.html">一覧に戻る</a><button id="logoutBtn" class="ghost">ログアウト</button></div></div>
  <div id="scopeTabs" class="scopeTabs hidden"><button class="scopeTab on" data-scope="self">自分</button><button class="scopeTab" data-scope="team">班全体</button></div>
  <div class="tabs"><button class="tab on" data-mode="day">今日</button><button class="tab" data-mode="week">週</button><button class="tab" data-mode="month">月</button><button class="tab" data-mode="all">累計</button></div>
  <div class="summary">
    <div class="stat"><div class="lab">総回転数</div><div id="games" class="val">0G</div></div>
    <div class="stat"><div class="lab">1日平均</div><div id="avgGames" class="val">0G</div></div>
    <div class="stat"><div class="lab">稼働日数</div><div id="days" class="val">0日</div></div>
    <div class="stat"><div class="lab">稼働件数</div><div id="count" class="val">0件</div></div>
  </div>
  <div id="periodNote" class="periodnote"></div>
  <div id="teamPanel" class="panel hidden"><div class="sectiontitle">👥 班員別</div><div id="memberCards" class="membergrid"></div></div>
  <div class="panel"><div class="sectiontitle">🎰 機種別</div><div id="machineRows"><div class="emptymsg">データを読み込み中…</div></div></div>
  <div class="panel"><div class="sectiontitle">🧾 稼働記録</div><div id="recordRows"><div class="emptymsg">データを読み込み中…</div></div></div>
  <div class="note">班員は自分の記録のみ。管理者は所属班の「班全体」を表示できます。閲覧制限はSupabase RLSでも実施します。</div>
</div>
<script>
const SUPABASE_URL="https://lwofzaywigjctempgwuf.supabase.co";
const SUPABASE_KEY="sb_publishable_Dhr4mauHCpbulYqfyvaX1w_5Qb45xFc";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let me=null, members=[], records=[], mode="day", scope="self";
const today=()=>new Date().toLocaleDateString("sv-SE");
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const localDay=r=>String(r.work_date||"").slice(0,10);
const sum=(rs,k)=>rs.reduce((a,r)=>a+(Number(r[k])||0),0);
function mondayOf(day){const [y,m,d]=day.split("-").map(Number),dt=new Date(y,m-1,d),dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return dt.toLocaleDateString("sv-SE")}
function endOfWeek(day){const s=mondayOf(day),[y,m,d]=s.split("-").map(Number),dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+6);return dt.toLocaleDateString("sv-SE")}
function inPeriod(r){const d=localDay(r),t=today();if(mode==="day")return d===t;if(mode==="week")return d>=mondayOf(t)&&d<=endOfWeek(t);if(mode==="month")return d.slice(0,7)===t.slice(0,7);return true}
function visibleRecords(){let rs=records.filter(inPeriod);if(scope==="self")rs=rs.filter(r=>Number(r.member_id)===Number(me.id));return rs}
function periodLabel(){const t=today();if(mode==="day")return `<b>${+t.slice(5,7)}月${+t.slice(8)}日</b>`;if(mode==="week"){const s=mondayOf(t),e=endOfWeek(t);return `<b>${+s.slice(5,7)}/${+s.slice(8)}〜${+e.slice(5,7)}/${+e.slice(8)}</b>（月〜日）`}if(mode==="month")return `<b>${t.slice(0,4)}年${+t.slice(5,7)}月</b>`;return "保存されている全期間"}
function machineMetric(rs,name){const normal=sum(rs,"normal_games"),used=sum(rs,"used_medals"),support=sum(rs,"support_games"),acquired=sum(rs,"acquired_medals");const rate=normal&&used?50/(used/normal):0;if(name==="北斗"||name==="モンキー"){const c1=sum(rs,"type1_count"),c2=sum(rs,"type2_count"),p1=rs.reduce((a,r)=>a+(Number(r.type1_payout)||0)*(Number(r.type1_count)||0),0),p2=rs.reduce((a,r)=>a+(Number(r.type2_payout)||0)*(Number(r.type2_count)||0),0);return `${rate?rate.toFixed(1):"-"} / ${c2?Math.round(p2/c2):"-"} / ${c1?Math.round(p1/c1):"-"}`}const pure=support?acquired/support:0;return `${rate?rate.toFixed(1):"-"} / ${support?pure.toFixed(2):"-"}`}
function render(){const rs=visibleRecords(),g=sum(rs,"total_games"),days=[...new Set(rs.map(localDay))].length,avg=days?g/days:0;$("games").textContent=Math.round(g).toLocaleString()+"G";$("avgGames").textContent=Math.round(avg).toLocaleString()+"G";$("days").textContent=days+"日";$("count").textContent=rs.length+"件";$("periodNote").innerHTML=periodLabel();
  const byMachine={};for(const r of rs)(byMachine[r.machine_name||"機種不明"]??=[]).push(r);const names=Object.keys(byMachine).sort();$("machineRows").innerHTML=names.length?names.map(n=>`<div class="row"><span><span class="machine">${esc(n)}</span><br><span class="sub">${byMachine[n].length}件 / ${sum(byMachine[n],"total_games").toLocaleString()}G</span></span><span class="right"><b>${machineMetric(byMachine[n],n)}</b><br><span class="sub">${n==="北斗"||n==="モンキー"?"回転率 / 2平均 / 1平均":"回転率 / 純増"}</span></span></div>`).join(""):`<div class="emptymsg">この期間のデータはありません</div>`;
  const nameMap=Object.fromEntries(members.map(m=>[m.id,m.name]));$("recordRows").innerHTML=rs.length?rs.slice().sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date))||Number(b.id)-Number(a.id)).map(r=>`<div class="row"><span><span class="machine">${esc(r.machine_name||"機種不明")}</span><br><span class="sub">${esc(r.work_date)} / ${esc(r.store_name||"")}${r.machine_number?" #"+esc(r.machine_number):""}${scope==="team"?" / "+esc(nameMap[r.member_id]||""):""}</span></span><span class="right"><b>${Number(r.total_games||0).toLocaleString()}G</b><br><span class="sub">通常 ${Number(r.normal_games||0).toLocaleString()}G</span><br><button class="deleteBtn" data-record-id="${Number(r.id)}" data-record-label="${esc((nameMap[r.member_id]||me.name)+" / "+(r.machine_name||"機種不明")+" / "+r.work_date)}">削除</button></span></div>`).join(""):`<div class="emptymsg">この期間のデータはありません</div>`;
  document.querySelectorAll(".deleteBtn").forEach(btn=>btn.onclick=async()=>{const id=Number(btn.dataset.recordId),label=btn.dataset.recordLabel;if(!confirm(`${label}\n\nこの稼働記録を削除しますか？`))return;btn.disabled=true;btn.textContent="削除中…";const {error}=await sb.from("records").delete().eq("id",id);if(error){alert("削除に失敗しました: "+error.message);btn.disabled=false;btn.textContent="削除";return;}records=records.filter(r=>Number(r.id)!==id);render();});
  const isTeam=scope==="team"&&me.role==="admin";$("teamPanel").classList.toggle("hidden",!isTeam);if(isTeam){$("memberCards").innerHTML=members.map(m=>{const mr=records.filter(r=>Number(r.member_id)===Number(m.id)&&inPeriod(r)),mg=sum(mr,"total_games"),md=[...new Set(mr.map(localDay))].length,ma=md?mg/md:0;return `<div class="membercard"><div class="membername">${esc(m.name)}${Number(m.id)===Number(me.id)?'<span class="badge">自分</span>':''}</div><div class="memberavg">${Math.round(ma).toLocaleString()}G</div><div class="sub">${md}日 / ${mr.length}件 / 合計 ${mg.toLocaleString()}G</div></div>`}).join("")||`<div class="emptymsg">班員がいません</div>`}
}
async function loadData(user){
  let authUser=user;
  if(!authUser){
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    authUser=data?.session?.user||null;
  }
  if(!authUser){showLogin();return;}
  $("loginStatus").className="status";
  $("loginStatus").textContent="ログイン状態を確認中…";
  const {data:self,error:e1}=await sb.from("members").select("id,name,team_id,role,active").eq("auth_user_id",authUser.id).maybeSingle();
  if(e1){console.error("members self load failed",e1);showLogin("班員情報の読み込みに失敗しました: "+e1.message,true);return;}
  if(!self){showLogin("この管理者アカウントはmembersに紐付いていません",true);return;}
  me=self;
  const {data:ms,error:e2}=await sb.from("members").select("id,name,team_id,role,active").eq("team_id",me.team_id).eq("active",true).order("id");
  if(e2)throw e2;
  members=ms||[];
  const {data:rs,error:e3}=await sb.from("records").select("*").order("work_date",{ascending:false});
  if(e3)throw e3;
  records=rs||[];
  $("who").textContent=`${me.name} / ${me.role==="admin"?"管理者":"班員"}`;
  $("scopeTabs").classList.toggle("hidden",me.role!=="admin");
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  render();
}
function showLogin(msg="",isError=false){
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginStatus").textContent=msg;
  $("loginStatus").className="status"+(isError?" error":"");
}
$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim(),password=$("password").value;
  $("loginStatus").textContent="ログイン中…";
  $("loginStatus").className="status";
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){$("loginStatus").textContent=error.message;$("loginStatus").className="status error";return;}
  try{await loadData(data?.user)}catch(e){showLogin(e.message,true)}
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();me=null;members=[];records=[];showLogin("ログアウトしました")};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.mode;render()});
document.querySelectorAll(".scopeTab").forEach(b=>b.onclick=()=>{if(b.dataset.scope==="team"&&me?.role!=="admin")return;document.querySelectorAll(".scopeTab").forEach(x=>x.classList.remove("on"));b.classList.add("on");scope=b.dataset.scope;render()});
sb.auth.getSession().then(({data,error})=>{if(error)throw error;if(data?.session?.user)return loadData(data.session.user);showLogin();}).catch(e=>showLogin(e.message,true));
</script></body></html>
