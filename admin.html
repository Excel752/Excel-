<!doctype html>
<html lang="ja"><head>

<style>
:root{--bg:#0d0d10;--card:#17171b;--line:#2e2e35;--text:#f0f0f2;--muted:#8f8f99;--gold:#d6bb79;--plus:#7ed6a0;--minus:#f08d91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:20px;margin:0}.back{font-size:12px;color:var(--muted);text-decoration:none}.tabs,.scopeTabs{display:flex;gap:6px;margin-bottom:10px}.tab,.scopeTab{flex:1;border:1px solid var(--line);background:#151519;color:var(--muted);padding:9px;border-radius:9px;font-weight:800}.tab.on,.scopeTab.on{background:#ece8df;color:#111}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.lab{font-size:10px;color:var(--muted)}.val{font-size:20px;font-weight:900;margin-top:4px}.panel{margin-top:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px}.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #29292f;padding:10px 1px;font-size:11px}.row:first-child{border-top:0}.machine{font-weight:900}.sub{color:var(--muted);font-size:9px}.right{text-align:right}.emptymsg{text-align:center;color:var(--muted);font-size:11px;padding:17px 0}.note{text-align:center;color:#666670;font-size:9px;margin-top:13px}.login{max-width:420px;margin:14vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.login h2{margin:0 0 12px;font-size:18px}.field{width:100%;margin:6px 0;background:#111115;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px}.primary{width:100%;margin-top:8px;border:0;border-radius:9px;padding:12px;background:#ece8df;color:#111;font-weight:900}.ghost{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#202025;color:#bbb;font-weight:700}.status{font-size:10px;color:var(--muted);margin-top:8px}.error{color:#f08d91}.ok{color:#7ed6a0}.hidden{display:none!important}.membergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.membercard{background:#111115;border:1px solid #28282e;border-radius:10px;padding:10px;cursor:pointer;transition:.12s}.membercard:active{transform:scale(.98);background:#19191e}.membercard.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.membername{font-size:12px;font-weight:900}.memberavg{font-size:19px;font-weight:900;margin-top:4px}.badge{display:inline-block;border:1px solid #44414a;border-radius:999px;padding:3px 7px;font-size:8px;color:var(--muted);margin-left:5px}.sectiontitle{font-size:13px;font-weight:900;margin-bottom:7px}.periodnote{text-align:center;font-size:9px;color:var(--muted);margin:8px 0 0}.periodnote b{color:var(--gold)}.metrics{font-size:10px;line-height:1.65;margin-top:5px}.danger{color:#f08d91}.muted{color:var(--muted)}.topActions{display:flex;gap:8px;align-items:center}.deleteBtn{margin-top:6px;border:1px solid #5a3035;background:#2a171a;color:#f3a3a8;border-radius:7px;padding:5px 9px;font-size:9px;font-weight:800}.deleteBtn:disabled{opacity:.5}.homeBtn{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#202025;color:#ddd;font-weight:700;text-decoration:none;font-size:12px}.detailBar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;padding:9px 10px;border:1px solid #494133;background:#211f19;border-radius:10px}.detailBar b{color:var(--gold)}.detailBack{border:1px solid #5c5340;background:#2b281f;color:#ead9aa;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:900}.machineBlock{border-top:1px solid #29292f;padding:12px 0}.machineBlock:first-child{border-top:0;padding-top:2px}.machineHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:7px}.machineTitle{font-size:13px;font-weight:900;color:var(--gold)}.machineTeamMetric{font-size:12px;font-weight:900;text-align:right}.machineMemberRow{display:flex;justify-content:space-between;gap:10px;padding:5px 1px;font-size:10px}.machineMemberRow .mn{font-weight:800}.machineMemberRow .mm{text-align:right;font-variant-numeric:tabular-nums}.copyBtn{width:100%;margin-top:9px;border:1px solid #494133;background:#211f19;color:#ead9aa;border-radius:8px;padding:9px;font-size:10px;font-weight:900}.addBtn{border:1px solid #5c5340;border-radius:8px;padding:7px 10px;background:#2b281f;color:#ead9aa;font-weight:900;font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}.modalCard{width:min(100%,560px);max-height:88vh;overflow:auto;background:#17171b;border:1px solid #3a3a42;border-radius:16px 16px 12px 12px;padding:14px}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.modalTitle{font-size:16px;font-weight:900}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formGrid .wide{grid-column:1/-1}.formLabel{font-size:9px;color:var(--muted);margin:1px 0 3px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modalActions button{margin-top:0}.saveStatus{font-size:10px;color:var(--muted);margin-top:8px;min-height:14px}
@media(max-width:380px){.val{font-size:18px}.memberavg{font-size:17px}}
</style></head><body>
<div id="loginView" class="login">
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><a class="homeBtn" href="./index.html">一覧に戻る</a></div>
  <h2>📊 稼働ダッシュボード</h2>
  <div class="lab">管理者アカウントでログイン（初回のみ）</div>
  <input id="email" class="field" type="email" autocomplete="username" placeholder="メールアドレス">
  <input id="password" class="field" type="password" autocomplete="current-password" placeholder="パスワード">
  <button id="loginBtn" class="primary">ログイン</button>
  <div id="loginStatus" class="status"></div>
</div>
<div id="appView" class="wrap hidden">
  <div class="top"><div><h1>📊 稼働ダッシュボード</h1><div id="who" class="status"></div></div><div class="topActions"><button id="openAddBtn" class="addBtn hidden">＋ 台を追加</button><a class="homeBtn" href="./index.html">一覧に戻る</a><button id="logoutBtn" class="ghost">ログアウト</button></div></div>
  <div id="scopeTabs" class="scopeTabs hidden"><button class="scopeTab on" data-scope="self">自分</button><button class="scopeTab" data-scope="team">班全体</button></div>
  <div id="detailBar" class="detailBar hidden"><span>👤 <b id="detailName"></b> の稼働を表示中</span><button id="detailBack" class="detailBack">班全体に戻る</button></div>
  <div class="tabs"><button class="tab on" data-mode="day">今日</button><button class="tab" data-mode="week">週</button><button class="tab" data-mode="month">月</button><button class="tab" data-mode="all">累計</button></div>
  <div class="summary">
    <div class="stat"><div class="lab">総回転数</div><div id="games" class="val">0G</div></div>
    <div class="stat"><div class="lab">1日平均</div><div id="avgGames" class="val">0G</div></div>
    <div class="stat"><div class="lab">稼働日数</div><div id="days" class="val">0日</div></div>
    <div class="stat"><div class="lab">稼働件数</div><div id="count" class="val">0件</div></div>
  </div>
  <div id="periodNote" class="periodnote"></div>
  <div id="teamPanel" class="panel hidden"><div class="sectiontitle">👥 班員別 <span class="sub">タップで個人詳細</span></div><div id="memberCards" class="membergrid"></div></div>
  <div id="teamMachinePanel" class="panel hidden"><div class="sectiontitle">📋 機種別・班データ</div><div id="teamMachineRows"></div><button id="copyTeamData" class="copyBtn">表示中の班データをコピー</button></div>
  <div class="panel"><div class="sectiontitle">🎰 機種別</div><div id="machineRows"><div class="emptymsg">データを読み込み中…</div></div></div>
  <div class="panel"><div class="sectiontitle">🧾 稼働記録</div><div id="recordRows"><div class="emptymsg">データを読み込み中…</div></div></div>
  <div class="note">班員は自分の記録のみ。管理者は所属班の「班全体」を表示できます。閲覧制限はSupabase RLSでも実施します。</div>
</div>
<div id="addModal" class="modal hidden">
  <div class="modalCard">
    <div class="modalHead"><div class="modalTitle">＋ 台を追加</div><button id="closeAddBtn" class="ghost">閉じる</button></div>
    <div class="formGrid">
      <div class="wide"><div class="formLabel">班員</div><select id="addMember" class="field"></select></div>
      <div><div class="formLabel">日付</div><input id="addDate" class="field" type="date"></div>
      <div><div class="formLabel">台番</div><input id="addMachineNo" class="field" inputmode="numeric" placeholder="例: 123"></div>
      <div class="wide"><div class="formLabel">店舗</div><input id="addStore" class="field" placeholder="店舗名"></div>
      <div class="wide"><div class="formLabel">機種</div><input id="addMachine" class="field" placeholder="機種名"></div>
      <div><div class="formLabel">回転</div><input id="addNormalGames" class="field" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><div class="formLabel">総回転</div><input id="addTotalGames" class="field" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><div class="formLabel">使用枚数</div><input id="addUsedMedals" class="field" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><div class="formLabel">獲得枚数</div><input id="addAcquiredMedals" class="field" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div class="wide"><div class="formLabel">電サポ</div><input id="addSupportGames" class="field" type="number" inputmode="numeric" min="0" placeholder="0"></div>
    </div>
    <div id="addStatus" class="saveStatus"></div>
    <div class="modalActions"><button id="cancelAddBtn" class="ghost">キャンセル</button><button id="saveAddBtn" class="primary">Supabaseに追加</button></div>
  </div>
</div>
<script>
const SUPABASE_URL="https://lwofzaywigjctempgwuf.supabase.co";
const SUPABASE_KEY="sb_publishable_Dhr4mauHCpbulYqfyvaX1w_5Qb45xFc";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let me=null, members=[], records=[], mode="day", scope="self", selectedMemberId=null;
const today=()=>new Date().toLocaleDateString("sv-SE");
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const localDay=r=>String(r.work_date||"").slice(0,10);
const sum=(rs,k)=>rs.reduce((a,r)=>a+(Number(r[k])||0),0);
function machineNameFromRecord(r){
  const raw=String(r.raw_data||"");
  const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

  // 例: (東京喰種   設定) / (北斗   リセ)
  for(const line of lines){
    const m=line.match(/^[（(]\s*([^()（）]+?)\s{2,}[^()（）]*[）)]$/);
    if(m){
      const name=m[1].trim();
      if(name && !/^\d+\s*:/.test(name)) return name;
    }
  }

  // 空白1つの形式にも対応
  for(const line of lines){
    const m=line.match(/^[（(]\s*(.+?)\s+(設定(?:[1-6])?|リセ|AT間|渡り歩き|強演出|天井狙い)\s*[）)]$/);
    if(m) return m[1].trim();
  }

  return String(r.machine_name||"").trim() || "機種不明";
}

function mondayOf(day){const [y,m,d]=day.split("-").map(Number),dt=new Date(y,m-1,d),dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return dt.toLocaleDateString("sv-SE")}
function endOfWeek(day){const s=mondayOf(day),[y,m,d]=s.split("-").map(Number),dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+6);return dt.toLocaleDateString("sv-SE")}
function inPeriod(r){const d=localDay(r),t=today();if(mode==="day")return d===t;if(mode==="week")return d>=mondayOf(t)&&d<=endOfWeek(t);if(mode==="month")return d.slice(0,7)===t.slice(0,7);return true}
function visibleRecords(){let rs=records.filter(inPeriod);if(scope==="self")rs=rs.filter(r=>Number(r.member_id)===Number(me.id));else if(scope==="team"&&selectedMemberId!=null)rs=rs.filter(r=>Number(r.member_id)===Number(selectedMemberId));return rs}
function periodLabel(){const t=today();if(mode==="day")return `<b>${+t.slice(5,7)}月${+t.slice(8)}日</b>`;if(mode==="week"){const s=mondayOf(t),e=endOfWeek(t);return `<b>${+s.slice(5,7)}/${+s.slice(8)}〜${+e.slice(5,7)}/${+e.slice(8)}</b>（月〜日）`}if(mode==="month")return `<b>${t.slice(0,4)}年${+t.slice(5,7)}月</b>`;return "保存されている全期間"}
function machineMetric(rs,name){const normal=sum(rs,"normal_games"),used=sum(rs,"used_medals"),support=sum(rs,"support_games"),acquired=sum(rs,"acquired_medals");const rate=normal&&used?50/(used/normal):0;if(name==="北斗"||name==="モンキー"){const c1=sum(rs,"type1_count"),c2=sum(rs,"type2_count"),p1=rs.reduce((a,r)=>a+(Number(r.type1_payout)||0)*(Number(r.type1_count)||0),0),p2=rs.reduce((a,r)=>a+(Number(r.type2_payout)||0)*(Number(r.type2_count)||0),0);return `${rate?rate.toFixed(1):"-"} / ${c2?Math.round(p2/c2):"-"} / ${c1?Math.round(p1/c1):"-"}`}const pure=support?acquired/support:0;return `${rate?rate.toFixed(1):"-"} / ${support?pure.toFixed(2):"-"}`}
function metricParts(rs,name){
  const normal=sum(rs,"normal_games"),used=sum(rs,"used_medals"),support=sum(rs,"support_games"),acquired=sum(rs,"acquired_medals");
  const rate=normal&&used?50/(used/normal):0;
  if(name==="北斗"||name==="モンキー"){
    const c1=sum(rs,"type1_count"),c2=sum(rs,"type2_count");
    const p1=rs.reduce((a,r)=>a+(Number(r.type1_payout)||0)*(Number(r.type1_count)||0),0);
    const p2=rs.reduce((a,r)=>a+(Number(r.type2_payout)||0)*(Number(r.type2_count)||0),0);
    return [rate?rate.toFixed(1):"-",c2?String(Math.round(p2/c2)):"-",c1?String(Math.round(p1/c1)):"-"];
  }
  return [rate?rate.toFixed(1):"-",support?(acquired/support).toFixed(2):"-"];
}
function teamMachineText(periodRecords){
  const byMachine={};for(const r of periodRecords)(byMachine[machineNameFromRecord(r)]??=[]).push(r);
  return Object.keys(byMachine).sort().map(name=>{
    const all=byMachine[name], head=`◆${name}◆${metricParts(all,name).join("/")}◆`;
    const lines=members.map(m=>{const mr=all.filter(r=>Number(r.member_id)===Number(m.id));return `${m.name}\t/${mr.length?metricParts(mr,name).join("/"):"—"}`});
    return [head,...lines].join("\n");
  }).join("\n\n");
}
function renderTeamMachines(periodRecords){
  const byMachine={};for(const r of periodRecords)(byMachine[machineNameFromRecord(r)]??=[]).push(r);
  const names=Object.keys(byMachine).sort();
  $("teamMachineRows").innerHTML=names.length?names.map(name=>{
    const all=byMachine[name], metric=metricParts(all,name).join(" / ");
    const rows=members.map(m=>{const mr=all.filter(r=>Number(r.member_id)===Number(m.id));return `<div class="machineMemberRow"><span class="mn">${esc(m.name)}</span><span class="mm">${mr.length?metricParts(mr,name).join(" / "):"—"}</span></div>`}).join("");
    return `<div class="machineBlock"><div class="machineHead"><span class="machineTitle">◆ ${esc(name)} ◆</span><span class="machineTeamMetric">${metric}<br><span class="sub">${name==="北斗"||name==="モンキー"?"回転率 / BB平均 / RB平均":"回転率 / 純増"}</span></span></div>${rows}</div>`;
  }).join(""):`<div class="emptymsg">この期間の班データはありません</div>`;
}
function render(){const rs=visibleRecords(),g=sum(rs,"total_games"),days=[...new Set(rs.map(localDay))].length,avg=days?g/days:0;$("games").textContent=Math.round(g).toLocaleString()+"G";$("avgGames").textContent=Math.round(avg).toLocaleString()+"G";$("days").textContent=days+"日";$("count").textContent=rs.length+"件";$("periodNote").innerHTML=periodLabel();
  const byMachine={};for(const r of rs)(byMachine[machineNameFromRecord(r)]??=[]).push(r);const names=Object.keys(byMachine).sort();$("machineRows").innerHTML=names.length?names.map(n=>`<div class="row"><span><span class="machine">${esc(n)}</span><br><span class="sub">${byMachine[n].length}件 / ${sum(byMachine[n],"total_games").toLocaleString()}G</span></span><span class="right"><b>${machineMetric(byMachine[n],n)}</b><br><span class="sub">${n==="北斗"||n==="モンキー"?"回転率 / 2平均 / 1平均":"回転率 / 純増"}</span></span></div>`).join(""):`<div class="emptymsg">この期間のデータはありません</div>`;
  const nameMap=Object.fromEntries(members.map(m=>[m.id,m.name]));$("recordRows").innerHTML=rs.length?rs.slice().sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date))||Number(b.id)-Number(a.id)).map(r=>`<div class="row"><span><span class="machine">${esc(machineNameFromRecord(r))}</span><br><span class="sub">${esc(r.work_date)} / ${esc(r.store_name||"")}${r.machine_number?" #"+esc(r.machine_number):""}${scope==="team"?" / "+esc(nameMap[r.member_id]||""):""}</span></span><span class="right"><b>${Number(r.total_games||0).toLocaleString()}G</b><br><span class="sub">通常 ${Number(r.normal_games||0).toLocaleString()}G</span><br><button class="deleteBtn" data-record-id="${Number(r.id)}" data-record-label="${esc((nameMap[r.member_id]||me.name)+" / "+machineNameFromRecord(r)+" / "+r.work_date)}">削除</button></span></div>`).join(""):`<div class="emptymsg">この期間のデータはありません</div>`;
  document.querySelectorAll(".deleteBtn").forEach(btn=>btn.onclick=async()=>{const id=Number(btn.dataset.recordId),label=btn.dataset.recordLabel;if(!confirm(`${label}\n\nこの稼働記録を削除しますか？`))return;btn.disabled=true;btn.textContent="削除中…";const {error}=await sb.from("records").delete().eq("id",id);if(error){alert("削除に失敗しました: "+error.message);btn.disabled=false;btn.textContent="削除";return;}records=records.filter(r=>Number(r.id)!==id);render();});
  const isTeam=scope==="team"&&me.role==="admin";
  const selectedMember=selectedMemberId==null?null:members.find(m=>Number(m.id)===Number(selectedMemberId));
  $("detailBar").classList.toggle("hidden",!isTeam||!selectedMember);
  if(selectedMember)$("detailName").textContent=selectedMember.name;
  $("teamPanel").classList.toggle("hidden",!isTeam||!!selectedMember);
  $("teamMachinePanel").classList.toggle("hidden",!isTeam||!!selectedMember);
  if(isTeam&&!selectedMember) renderTeamMachines(records.filter(inPeriod));
  if(isTeam){
    $("memberCards").innerHTML=members.map(m=>{const mr=records.filter(r=>Number(r.member_id)===Number(m.id)&&inPeriod(r)),mg=sum(mr,"total_games"),md=[...new Set(mr.map(localDay))].length,ma=md?mg/md:0;return `<div class="membercard${Number(selectedMemberId)===Number(m.id)?" selected":""}" data-member-id="${Number(m.id)}"><div class="membername">${esc(m.name)}${Number(m.id)===Number(me.id)?'<span class="badge">自分</span>':''}</div><div class="memberavg">${Math.round(ma).toLocaleString()}G</div><div class="sub">${md}日 / ${mr.length}件 / 合計 ${mg.toLocaleString()}G</div></div>`}).join("")||`<div class="emptymsg">班員がいません</div>`;
    document.querySelectorAll(".membercard[data-member-id]").forEach(card=>card.onclick=()=>{selectedMemberId=Number(card.dataset.memberId);render();window.scrollTo({top:0,behavior:"smooth"})});
  }
}
function openAddModal(){
  if(me?.role!=="admin")return;
  $("addDate").value=today();
  $("addMember").innerHTML=members.map(m=>`<option value="${Number(m.id)}"${Number(m.id)===Number(me.id)?" selected":""}>${esc(m.name)}</option>`).join("");
  ["addMachineNo","addStore","addMachine","addNormalGames","addTotalGames","addUsedMedals","addAcquiredMedals","addSupportGames"].forEach(id=>$(id).value="");
  $("addStatus").textContent="";
  $("addModal").classList.remove("hidden");
}
function closeAddModal(){$("addModal").classList.add("hidden")}
async function saveManualRecord(){
  if(me?.role!=="admin"){alert("管理者のみ追加できます");return;}
  const memberId=Number($("addMember").value);
  const member=members.find(m=>Number(m.id)===memberId);
  const workDate=$("addDate").value;
  const machineName=$("addMachine").value.trim();
  const num=id=>Number(String($(id).value||"0").replace(/,/g,""));
  const normalGames=num("addNormalGames"),totalGames=num("addTotalGames"),usedMedals=num("addUsedMedals"),acquiredMedals=num("addAcquiredMedals"),supportGames=num("addSupportGames");
  if(!member){alert("班員を選択してください");return;}
  if(!workDate){alert("日付を選択してください");return;}
  if(!machineName){alert("機種名を入力してください");return;}
  if([normalGames,totalGames,usedMedals,acquiredMedals,supportGames].some(v=>!Number.isFinite(v)||v<0)){alert("回転・総回転・使用枚数・獲得枚数・電サポは0以上の数値で入力してください");return;}
  const payload={
    member_id:memberId,
    work_date:workDate,
    machine_name:machineName,
    store_name:$("addStore").value.trim(),
    machine_number:$("addMachineNo").value.trim(),
    normal_games:Math.round(normalGames),
    total_games:Math.round(totalGames),
    support_games:Math.round(supportGames),
    used_medals:Math.round(usedMedals),
    acquired_medals:Math.round(acquiredMedals),
    type1_count:0,type1_payout:0,type2_count:0,type2_payout:0,
    source_key:`manual|${workDate}|${memberId}|${Date.now()}`,
    raw_data:`[管理者手動追加]\n名前${member.name}\n店名${$("addStore").value.trim()}\n台番${$("addMachineNo").value.trim()}\n機種${machineName}`
  };
  const btn=$("saveAddBtn");btn.disabled=true;btn.textContent="追加中…";$("addStatus").className="saveStatus";$("addStatus").textContent="Supabaseへ保存しています…";
  const {data,error}=await sb.from("records").insert(payload).select("*").single();
  btn.disabled=false;btn.textContent="Supabaseに追加";
  if(error){$("addStatus").className="saveStatus error";$("addStatus").textContent="追加に失敗しました: "+error.message;return;}
  records.unshift(data);
  closeAddModal();
  render();
}

async function loadData(user){
  let authUser=user;
  if(!authUser){
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    authUser=data?.session?.user||null;
  }
  if(!authUser){showLogin();return;}
  $("loginStatus").className="status";
  $("loginStatus").textContent="ログイン状態を確認中…";
  const {data:self,error:e1}=await sb.from("members").select("id,name,team_id,role,active").eq("auth_user_id",authUser.id).maybeSingle();
  if(e1){console.error("members self load failed",e1);showLogin("班員情報の読み込みに失敗しました: "+e1.message,true);return;}
  if(!self){showLogin("この管理者アカウントはmembersに紐付いていません",true);return;}
  me=self;
  const {data:ms,error:e2}=await sb.from("members").select("id,name,team_id,role,active").eq("team_id",me.team_id).eq("active",true).order("id");
  if(e2)throw e2;
  members=ms||[];
  const {data:rs,error:e3}=await sb.from("records").select("*").order("work_date",{ascending:false});
  if(e3)throw e3;
  records=rs||[];
  $("who").textContent=`${me.name} / ${me.role==="admin"?"管理者":"班員"}`;
  $("scopeTabs").classList.toggle("hidden",me.role!=="admin");
  $("openAddBtn").classList.toggle("hidden",me.role!=="admin");
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  render();
}
function showLogin(msg="",isError=false){
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginStatus").textContent=msg;
  $("loginStatus").className="status"+(isError?" error":"");
}
$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim(),password=$("password").value;
  $("loginStatus").textContent="ログイン中…";
  $("loginStatus").className="status";
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){$("loginStatus").textContent=error.message;$("loginStatus").className="status error";return;}
  try{await loadData(data?.user)}catch(e){showLogin(e.message,true)}
};
$("openAddBtn").onclick=openAddModal;
$("closeAddBtn").onclick=closeAddModal;
$("cancelAddBtn").onclick=closeAddModal;
$("saveAddBtn").onclick=saveManualRecord;
$("addModal").onclick=e=>{if(e.target===$("addModal"))closeAddModal()};
$("copyTeamData").onclick=async()=>{const text=teamMachineText(records.filter(inPeriod));if(!text){alert("コピーできる班データがありません");return;}try{await navigator.clipboard.writeText(text);const b=$("copyTeamData");const old=b.textContent;b.textContent="コピーしました ✓";setTimeout(()=>b.textContent=old,1400)}catch(e){prompt("この内容をコピーしてください",text)}};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();me=null;members=[];records=[];showLogin("ログアウトしました")};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.mode;render()});
document.querySelectorAll(".scopeTab").forEach(b=>b.onclick=()=>{if(b.dataset.scope==="team"&&me?.role!=="admin")return;document.querySelectorAll(".scopeTab").forEach(x=>x.classList.remove("on"));b.classList.add("on");scope=b.dataset.scope;selectedMemberId=null;render()});
$("detailBack").onclick=()=>{selectedMemberId=null;render()};
sb.auth.getSession().then(({data,error})=>{if(error)throw error;if(data?.session?.user)return loadData(data.session.user);showLogin();}).catch(e=>showLogin(e.message,true));
</script></body></html>
